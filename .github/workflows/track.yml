name: Track Vinted Go lockers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read lockers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py

      - name: Save data
        if: always()
        run: |
          git config user.name "locker-tracker"
          git config user.email "locker-tracker@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || git commit -m "Locker snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase && git push
